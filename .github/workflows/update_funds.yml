name: Tum Fonlari Getir

on:
  schedule:
    - cron: '0 4 * * 1-5'   # Her iş günü 19:00 TSİ (UTC+3 = UTC 16:00)
    - cron: '0 6 * * 1-5'    # Her iş günü 12:00 TSİ
    - cron: '0 8 * * 1-5'    # Her iş günü 12:00 TSİ
  workflow_dispatch:           # Manuel tetikleme butonu

permissions:
  contents: write              # Repo'ya yazma izni

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: Scripti çalıştır
        run: python fetch_funds.py

      - name: funds.json'u kaydet
        run: |
          # ← YENİ: Dosyanın geçerli JSON olup olmadığını kontrol et
          python -c "import json; json.load(open('funds.json'))" || exit 1
          
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funds.json
          git diff --staged --quiet || git commit -m "🔄 Fon verileri güncellendi [$(date +'%Y-%m-%d %H:%M')]"
          git push
